[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
# Size-optimised: a supervisor waits far more than it computes. Measured
# against opt-level 3: binary 6.0 -> 3.8 MB, shim RSS 2.7 -> 2.4 MiB,
# daemon RSS 4.8 -> 3.9 MiB, and `vexor ls` 5.3 -> 4.3 ms (less to load).
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
