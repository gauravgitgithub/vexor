[package]
name = "vexor-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.191"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process", "system"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "signal", "io-util", "net", "sync", "fs"] }
vexor-core = { path = "../vexor-core" }
vexor-proto = { path = "../vexor-proto" }
vexor-shim = { path = "../vexor-shim" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
