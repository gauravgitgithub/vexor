[package]
name = "vexor-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
command-fds = { version = "0.3.3", features = ["tokio"] }
libc = "0.2.191"
rustix = { version = "1.1.5", features = ["fs", "param", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "signal", "io-util", "sync", "net", "fs"] }
vexor-core = { path = "../vexor-core" }
vexor-proto = { path = "../vexor-proto" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
